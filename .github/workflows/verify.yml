name: Verify DSBCA
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: dsbca_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: dsbca_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AI_VECTOR_BACKEND: exact
      JWT_SECRET_KEY: isolated-ci-jwt-key-never-used-in-deployment
      DATABASE_URL_UNPOOLED: postgresql+psycopg://dsbca_test:isolated-ci-only@localhost:5432/dsbca_test
      TEST_DATABASE_URL: postgresql+psycopg://dsbca_test:isolated-ci-only@localhost:5432/dsbca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip==26.2.2
      - run: pip install -r requirements-dev.txt
      - run: pip install ruff==0.17.1 pip-audit==2.10.1 bandit==1.9.4
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: pip-audit -r requirements-lock.txt
      - run: bandit -r app -ll
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dsbca_user, dsbca_admin]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/${{ matrix.app }}
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/${{ matrix.app }}
      - run: flutter analyze && flutter test && flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=http://localhost:8003
        working-directory: apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-web-qa
          path: apps/${{ matrix.app }}/build/web
