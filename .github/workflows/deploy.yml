name: Approved production deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsbca-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        project: [api, user, admin]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.project == 'api' && secrets.VERCEL_API_PROJECT_ID || matrix.project == 'user' && secrets.VERCEL_USER_PROJECT_ID || secrets.VERCEL_ADMIN_PROJECT_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - name: Validate protected release configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          [[ "$API_BASE_URL" == https://* ]] || exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pre-deployment schema gate
        shell: bash
        run: |
          curl --fail --max-time 30 "$API_BASE_URL/api/v1/ready" -o "$RUNNER_TEMP/dsbca-ready.json"
          python -c "import json,os; assert json.load(open(os.environ['RUNNER_TEMP']+'/dsbca-ready.json')).get('schema_revision') == '0004', 'Reviewed schema 0004 required before deployment'"
      - name: Build web release
        if: matrix.project != 'api'
        shell: bash
        run: |
          cd "apps/dsbca_$PROJECT"
          flutter pub get --enforce-lockfile
          flutter build web --release --no-wasm-dry-run --dart-define="API_BASE_URL=$API_BASE_URL"
          cp vercel.json build/web/vercel.json
      - name: Deploy approved project
        shell: bash
        run: |
          if [ "$PROJECT" = api ]; then cd backend; else cd "apps/dsbca_$PROJECT/build/web"; fi
          npx vercel@50.0.0 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Post-deployment readiness
        shell: bash
        run: curl --fail --retry 3 --max-time 30 "$API_BASE_URL/api/v1/ready"
